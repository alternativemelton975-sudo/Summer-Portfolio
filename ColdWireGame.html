<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cold Wire Game</title>
  <style>
    body { margin: 0; background: #222; color: #fff; font-family: Arial, sans-serif; }
    .wrap { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    canvas { background: #333; border: 4px solid #555; border-radius: 8px; }
    #cold-wire-game { 
      max-width: 600px; 
      padding: 30px; 
      text-align: center; 
      background: #333; 
      border-radius: 8px; 
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
    }
    #cold-wire-game h2 { margin: 0 0 10px 0; color: #f00; }
    #cold-wire-game p { margin: 5px 0; }
    .cold-wire-status { 
      font-size: 14px; 
      padding: 10px; 
      background: #222; 
      border-radius: 4px; 
      min-height: 20px;
    }
    .cold-wire-area { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 10px; 
      justify-content: center; 
      padding: 20px 0;
    }
    .cold-wire-button { 
      width: 100px; 
      height: 60px; 
      font-size: 12px; 
      font-weight: bold; 
      color: #fff; 
      border: 2px solid #666; 
      border-radius: 4px; 
      cursor: pointer; 
      transition: all 0.2s;
    }
    .cold-wire-button:hover:not(:disabled) { 
      transform: scale(1.1); 
      box-shadow: 0 0 10px currentColor;
    }
    .cold-wire-button:disabled { 
      opacity: 0.5; 
      cursor: not-allowed;
    }
    .cold-wire-controls { 
      display: flex; 
      gap: 10px; 
      justify-content: center;
    }
    .cold-wire-controls button { 
      padding: 10px 20px; 
      background: #f00; 
      color: #fff; 
      border: none; 
      border-radius: 4px; 
      font-weight: bold; 
      cursor: pointer; 
      transition: all 0.2s;
    }
    .cold-wire-controls button:hover { 
      background: #cc0000; 
      box-shadow: 0 0 10px #f00;
    }
  </style>
</head>
<body>
  <script src="ColdWireGame.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      ColdWireGame.init();
    });
  </script>
</body>
</html>
